[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-automata-framework"
version = "0.1.0"
description = "Common core foundation for Progressive-AUTOMATA experiments"
requires-python = ">=3.9"
authors = [
  {name = "AI Research Automation", email = "noreply@example.com"}
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "timm>=0.9.8",
  "datasets>=2.14.1",
  "transformers>=4.32.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.12.2",
  "scikit-learn>=1.2",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
