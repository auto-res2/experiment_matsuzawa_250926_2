[project]
name = "common-core-foundation"
version = "0.1.0"
description = "Common Core Foundation for ES-TENT experiments"
requires-python = "~=3.10"
license = {text = "MIT"}
authors = [{name = "Researcher", email = "research@example.com"}]

dependencies = [
    "torch",
    "torchvision",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "numpy",
    "scikit-learn",
    "pandas",
    "tqdm",
    "datasets",
    "pillow",
    "timm"
]

[build-system]
requires = ["setuptools", "wheel"]
