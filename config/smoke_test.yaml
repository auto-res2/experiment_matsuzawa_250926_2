# config/smoke_test.yaml
# Configuration used by `uv run python -m src.main --smoke-test`

dataset:
  name: SMOKE_DATASET
  num_classes: 5
  input_shape: [3, 32, 32]
  num_samples_per_class: 40

model:
  name: CONV4_SMOKE
  in_channels: 3
  hidden: 32
  embedding_dim: 64

algo:
  way: 5
  shot: 1
  query: 5
  tau: 0.2
  lambda: 0.1
  gamma: 0.01
  temperature: 10.0
  grad_clip: null

training:
  epochs: 2
  episodes_per_epoch: 10
  batch_size: 1
  lr: 0.001
  lr_scheduler: none
  weight_decay: 0.0
  checkpoint_dir: checkpoints
  seed: 42
  device: cuda

evaluation:
  episodes: 20
  batch_size: 1
  confidence_level: 0.95
  results_dir: results
